<nav class="navbar" [class.scrolled]="scrolled" [class.sidebar-mode]="layout === 'sidebar'" [class.mobile-menu-open]="mobileOpen">
  <div class="nav-container container">

    <!-- Logo -->
    <a class="nav-logo" (click)="scrollTo('home')">
      <svg class="logo-ico" width="36" height="36" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="48" stroke="var(--blue)" stroke-width="4" />
        <path d="M35 40L25 50L35 60" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M65 40L75 50L65 60" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M55 35L45 65" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" />
      </svg>
      <span class="logo-text">Lyhuoy<span>Dev</span></span>
    </a>

    <!-- Main Navigation Links -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a [class.active]="activeSection === link.id" (click)="scrollTo(link.id)">
          <svg class="nav-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="link.icon"></path>
          </svg>
          <span class="nav-label">{{ link.label }}</span>
        </a>
      </li>
      
      <!-- Appended Actions directly inside the horizontal scrolling pill -->
      <li *ngIf="layout === 'sidebar'" class="scroll-action-mobile mobile-only">
        <a (click)="toggleTheme()">
          <svg *ngIf="isDarkMode" class="nav-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg *ngIf="!isDarkMode" class="nav-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="nav-label">Theme</span>
        </a>
      </li>
      <li *ngIf="layout === 'sidebar'" class="scroll-action-mobile mobile-only">
        <a (click)="toggleLayout()">
          <svg class="nav-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          <span class="nav-label">Navbar</span>
        </a>
      </li>
      <li *ngIf="layout === 'sidebar'" class="scroll-action-mobile mobile-only">
        <a (click)="toggleChat()">
          <svg class="nav-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"></path>
          </svg>
          <span class="nav-label">Chat</span>
        </a>
      </li>
    </ul>

    <!-- Actions (Desktop & Hamburger) -->
    <div class="nav-actions">
      <button class="icon-btn desktop-only" (click)="toggleLayout()" [title]="'Change Layout'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn desktop-only" (click)="toggleTheme()" [title]="'Toggle Theme'">
        <svg *ngIf="isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg *ngIf="!isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn btn-primary nav-btn desktop-only" (click)="scrollTo('contact')">Get Started</button>
      
      <!-- Hamburger only for mobile navbar mode -->
      <button class="hamburger" [class.open]="mobileOpen" (click)="toggleMobile()" *ngIf="layout === 'navbar'">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>

</nav>

<!-- Mobile Menu Drawer (Only for Navbar Mode on Mobile) -->
<ng-container *ngIf="layout === 'navbar'">
  <div class="nav-backdrop" *ngIf="mobileOpen" (click)="toggleMobile()"></div>
  <div class="mobile-menu" [class.open]="mobileOpen">
    <div class="mobile-header">
      <a class="nav-logo" (click)="scrollTo('home')">
        <svg class="logo-ico" width="32" height="32" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="48" stroke="var(--blue)" stroke-width="4" />
          <path d="M35 40L25 50L35 60" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M65 40L75 50L65 60" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M55 35L45 65" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" />
        </svg>
        <span class="logo-text">Lyhuoy<span>Dev</span></span>
      </a>
      <button class="close-btn" (click)="toggleMobile()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    
    <div class="mobile-content">
      <div class="mobile-links">
        <a *ngFor="let link of navLinks" (click)="scrollTo(link.id)" [class.active]="activeSection === link.id">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="link.icon"></path>
          </svg>
          <span class="m-label">{{ link.label }}</span>
        </a>
        <a (click)="toggleChat()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"></path>
          </svg>
          <span class="m-label">Chat Assistant</span>
        </a>
      </div>
      
      <div class="mobile-footer">
        <div class="m-toggles">
          <button class="m-toggle-btn" (click)="toggleLayout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            Switch to Sidebar
          </button>
          <button class="m-toggle-btn" (click)="toggleTheme()">
            <svg *ngIf="isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg *ngIf="!isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
          </button>
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" (click)="scrollTo('contact')">Get Started</button>
      </div>
    </div>
  </div>
</ng-container>
