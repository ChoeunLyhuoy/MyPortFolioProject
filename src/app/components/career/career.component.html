<section id="career" class="section career-section">
  <div class="container">

    <div class="career-header reveal">
      <p class="section-label" style="justify-content:center">My Journey</p>
      <h2 class="section-title" style="text-align:center">Work <span>Experience</span></h2>
      <p class="section-sub" style="text-align:center;margin:0 auto;max-width:560px">
        A timeline of my professional growth, backend systems development, and engineering roles.
      </p>
    </div>

    <div class="jobs-grid">
      <div class="job-card reveal" *ngFor="let job of jobs">
        <div class="job-header">
          <div>
            <h4 class="job-title">{{ job.title }}</h4>
            <div class="job-company" style="font-weight: 600; color: var(--cyan); font-size: 0.95rem; margin-top: 4px;">{{ job.company }}</div>
          </div>
          <span class="job-type">{{ job.type }}</span>
        </div>
        <p class="job-meta">
          <span class="job-loc">📍 {{ job.location }}</span>
          <span class="job-dept"> — {{ job.date }}</span>
        </p>
        <ul class="job-description">
          <li *ngFor="let bullet of job.description">
            {{ bullet }}
          </li>
        </ul>

        <div class="tags" style="margin-top: 20px;">
          <span class="tag" *ngFor="let t of job.tags">{{ t }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
