<section id="contact" class="section contact-section">
  <div class="glow-circle contact-glow"></div>
  <div class="container">

    <div class="contact-grid">

      <!-- Info Side -->
      <div class="contact-info reveal">
        <p class="section-label">Get In Touch</p>
        <h2 class="contact-title">Contact <span>Us</span></h2>
        <p class="contact-subtitle">Have a project in mind? We'd love to hear from you. Send us a message and we'll respond within 24 hours.</p>

        <div class="contact-items">
          <div class="contact-item" *ngFor="let item of contactItems">
            <div class="contact-ico">{{ item.icon }}</div>
            <div>
              <div class="item-title">{{ item.title }}</div>
              <div class="item-val">{{ item.value }}</div>
            </div>
          </div>
        </div>

        <div class="social-links">
          <a class="social-btn" *ngFor="let s of socials" [title]="s.label" [href]="s.url" target="_blank">
            <img [src]="s.icon" [alt]="s.label" style="width: 24px; height: 24px; object-fit: contain;" loading="lazy">
          </a>
        </div>
      </div>

      <!-- Form Side -->
      <div class="contact-form-wrap glass-card reveal">
        <h3 class="form-title">Send a Message</h3>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-input" type="text" placeholder="Alex" [(ngModel)]="form.firstName" name="firstName" />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-input" type="text" placeholder="Rivera" [(ngModel)]="form.lastName" name="lastName" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="email-input-wrapper">
            <input class="form-input email-input-field" type="email" placeholder="alex@company.com" [(ngModel)]="form.email" name="email" [disabled]="otpSent" />
            <button class="otp-send-btn" (click)="sendOtp()" [disabled]="sendingOtp || otpSent || !form.email">
              <span *ngIf="!sendingOtp && !otpSent">Send Code</span>
              <span *ngIf="sendingOtp">Sending…</span>
              <span *ngIf="otpSent">Sent ✓</span>
            </button>
          </div>
        </div>

        <div class="form-group slide-down" *ngIf="otpSent">
          <label class="form-label">Verification OTP Code</label>
          <input class="form-input otp-code-field" type="text" placeholder="Enter 6-digit OTP code" [(ngModel)]="otpCode" name="otpCode" maxlength="6" />
          <p class="otp-info-msg">A 6-digit verification code has been sent to your email.</p>
        </div>

        <div class="form-group">
          <label class="form-label">Service Interested In</label>
          <select class="form-select" [(ngModel)]="form.service" name="service">
            <option value="">Select a service…</option>
            <option *ngFor="let s of services" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Attach Project Brief / CV (Optional)</label>
          <div class="file-upload-wrapper">
            <input class="file-upload-input" type="file" id="contactFile" (change)="onFileChange($event)" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.zip" />
            <label for="contactFile" class="file-upload-label">
              <span class="file-name">{{ selectedFileName || 'Choose file (PDF, DOCX, JPG, PNG, ZIP)...' }}</span>
              <span class="file-btn">Browse</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-textarea" placeholder="Tell us about your project…" [(ngModel)]="form.message" name="message"></textarea>
        </div>

        <button class="form-submit btn btn-primary" (click)="submit()" [disabled]="sending || sent || !otpSent || !otpCode || otpCode.length !== 6">
          <span *ngIf="!sending && !sent">Send Message →</span>
          <span *ngIf="sending">Sending…</span>
          <span *ngIf="sent" class="sent-msg">✓ Message Sent!</span>
        </button>
      </div>

    </div>
  </div>
</section>
